<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento de Consulta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Agendamento de Consulta</h1>

            <p class="subtitle">
                Escolha uma data e um horário disponível.
            </p>

            <div class="form-group">
                <label for="date">Data da consulta</label>

                <input
                    type="date"
                    id="date"
                >
            </div>

            <div id="message"></div>

            <div id="loading" class="hidden">
                Consultando horários...
            </div>

            <section id="schedule" class="hidden">

                <h2>Horários disponíveis</h2>

                <div id="times" class="times"></div>

            </section>

            <section id="appointment-form" class="hidden">

                <h2>Confirmar agendamento</h2>

                <div class="selected-info">

                    <p>
                        <strong>Data:</strong>
                        <span id="selected-date"></span>
                    </p>

                    <p>
                        <strong>Horário:</strong>
                        <span id="selected-time"></span>
                    </p>

                </div>

                <div class="form-group">

                    <label for="patient-name">
                        Nome do paciente
                    </label>

                    <input
                        type="text"
                        id="patient-name"
                        placeholder="Digite seu nome"
                    >

                </div>

                <button id="confirm-button">
                    Confirmar agendamento
                </button>

            </section>

            <section id="confirmation" class="confirmation hidden">

                <h2>Agendamento realizado!</h2>

                <p id="confirmation-message"></p>

            </section>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
